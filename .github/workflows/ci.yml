name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest pytest-asyncio build twine

      - name: Run unit tests
        run: |
          if [ -f "/mnt/ssd256/genesis/.venv/bin/pytest" ]; then
            /mnt/ssd256/genesis/.venv/bin/pytest -v tests/
          else
            pytest -v tests/
          fi

      - name: Build package and verify distribution
        run: |
          python -m build
          twine check dist/*
