[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-blackbox"
version = "0.1.2"
description = "Deterministic Runtime Flight Recorder & AST Blast-Radius Causal Crash Compiler for AI-Assisted Software Engineering"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Johann Schiffer" }]
keywords = ["mcp", "debugging", "ast", "flight-recorder", "ai-agents", "sqlite-wal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Quality Assurance"
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.20.0"]

[project.scripts]
blackbox = "blackbox.cli:main"
blackbox-mcp = "blackbox.mcp_server:main"

[project.urls]
Homepage = "https://github.com/johannschiffer/genesis-blackbox"
Repository = "https://github.com/johannschiffer/genesis-blackbox"
"Support / Donate" = "https://ko-fi.com/johannschiffer"

[tool.setuptools.package-data]
blackbox = ["templates/rules/*"]

